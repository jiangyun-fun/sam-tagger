name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pysam comes from conda-forge/bioconda, so CI solves the env via pixi
      # (pysam is intentionally not a PyPI dep). pixi.lock is committed, so the
      # solve is fixed; ubuntu-latest matches the only declared platform (linux-64).
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true
      - run: pixi run -e dev lint
      - run: pixi run -e dev typecheck
      - run: pixi run -e dev test
