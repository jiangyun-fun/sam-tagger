[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sam-tagger"
version = "3.0.0"
description = "SAM/BAM tagger and amplicon QC stat generator (annotate / error-stats / pileup subcommands)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Yun Jiang", email = "jiangyunacw@gmail.com" }]
# pysam is provided via conda in pixi.toml (more reliable htslib build);
# it is intentionally omitted from PyPI deps. See README.
dependencies = [
    "polars>=1.0",
    "cyclopts>=3.0",
    "loguru>=0.7",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/jiangyun-fun/sam-tagger"
Repository = "https://github.com/jiangyun-fun/sam-tagger"
Issues = "https://github.com/jiangyun-fun/sam-tagger/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sam-tagger = "sam_tagger.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sam_tagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# Type-check the shipped package + tests. One-off scripts/ harnesses are
# excluded (their subprocess.run overloads are noise, not shipped code).
include = ["src", "tests"]
exclude = [".pixi", "build", "scripts"]
typeCheckingMode = "basic"
reportPrivateImportUsage = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# __version__ is defined before the re-exports (so sam_tagger.cli can resolve it
# during import), which puts imports after an assignment.
"src/sam_tagger/__init__.py" = ["E402"]
# Test fixtures embed long tab-delimited SAM record literals.
"tests/*" = ["E501"]
# One-off validation harnesses: long CLI/SAM literals, semicolon-joined error prints.
"scripts/*" = ["E501", "E702", "B007"]
